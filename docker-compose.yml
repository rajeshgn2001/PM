services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kanban-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_PATH: /data/kanban.db
    volumes:
      - kanban-data:/data
    restart: unless-stopped

volumes:
  kanban-data:
